"$schema" = 'https://starship.rs/config-schema.json'
add_newline = false

format = """
[](fg:sky)$directory[](fg:sky) \
([](fg:mint)$git_branch$git_status[](fg:mint) )\
$character"""

palette = "minty"

[palettes.minty]
sky = "#74c7ec"   # light blue for directory pill
mint = "#94e2d5"   # minty green for git pill
green = "#a6e3a1"   # success arrow
red = "#f38ba8"   # failure arrow
crust = "#11111b"   # text on pills

[directory]
style = "bg:sky fg:crust"
format = "[$path$read_only]($style)"
read_only = " \U000f033e"
truncation_length = 0
truncate_to_repo = false

[git_branch]
symbol = ""
style = "bg:mint fg:crust"
format = "[$symbol $branch]($style)"

[git_status]
style = "bg:mint fg:crust"
format = "[( $all_status$ahead_behind)]($style)"

[character]
success_symbol = "[❯](bold fg:green)"
error_symbol = "[❯](bold fg:red)"
